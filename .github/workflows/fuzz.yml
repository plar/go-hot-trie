name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *' # nightly
  workflow_dispatch:

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }}, GOEXPERIMENT=${{ matrix.goexperiment || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzTreeOps, FuzzKeyEncoding, FuzzDeterminism]
        goexperiment: ['', 'simd']
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ matrix.goexperiment || 'scalar' }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-${{ matrix.goexperiment || 'scalar' }}-
      - run: go test -run '^$' -fuzz ${{ matrix.target }} -fuzztime 10m ./
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.target }}-${{ matrix.goexperiment || 'scalar' }}
          path: testdata/fuzz
          if-no-files-found: ignore
